    <script type="module">
        // Slideshow functions
        function closeSlides() {
            $("#anno10").fadeOut();
            const parentWin = window.parent;
            const sidebar = parentWin.document.getElementById('split-container');
            if (sidebar) sidebar.style.opacity = "1";
        }

        let slideIndex = 1;
        showSlides(slideIndex);

        function plusSlides(n) {
            showSlides(slideIndex += n);
        }

        function currentSlide(n) {
            showSlides(slideIndex = n);
        }

        function showSlides(n) {
            const slides = document.getElementsByClassName("mySlides");
            const dots = document.getElementsByClassName("dot");
            
            if (n > slides.length) slideIndex = 1;
            if (n < 1) slideIndex = slides.length;
            
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            for (let i = 0; i < dots.length; i++) {
                dots[i].className = dots[i].className.replace(" active", "");
            }
            
            slides[slideIndex - 1].style.display = "block";
            dots[slideIndex - 1].className += " active";
        }

        // Make functions global for onclick handlers
        window.closeSlides = closeSlides;
        window.plusSlides = plusSlides;
        window.currentSlide = currentSlide;

        // Parse hotspot from referrer
        const src = document.referrer;
        const srcSplit = src.split("?");
        const hotSpot = parseFloat(srcSplit[1]);

        // Opening transitions
        const transitions = {
            0: () => scenears.annotations.children[1].moveHere(scenears.camera),
            1: () => scenears.annotations.children[0].moveHere(scenears.camera),
            2: () => scenears.annotations.children[2].moveHere(scenears.camera),
            3: () => {
                event.stopPropagation();
                viewer.setScene(indoor);
                scenears.annotations.children[3].moveHere(scenears.camera);
            }
        };

        if (transitions[hotSpot]) {
            setTimeout(transitions[hotSpot], hotSpot === 3 ? 2000 : 1500);
        }

        // Hotspot dropdown toggle
        $("#hotspots").click(() => $("#lists").toggle());

        // Annotation description helpers
        const toggleDescription = (annotationNum, show) => {
            const descriptions = document.getElementsByClassName("annotation-description");
            if (descriptions[annotationNum]) {
                descriptions[annotationNum].style.display = show ? "block" : "none";
            }
        };

        // Set annotation visibility
        const setAnnotationVisibility = (visibleIndices) => {
            for (let i = 0; i < scenears.annotations.children.length; i++) {
                scenears.annotations.children[i].visible = visibleIndices.includes(i);
            }
        };

        // Hotspot item functions
        const hotspotConfigs = [
            { name: "San Giovanni", camera: 1, showDesc: [1], hideDesc: [4], visible: [0, 1, 2] },
            { name: "San Benedetto", camera: 0, showDesc: [], hideDesc: [1, 4], visible: [0, 1, 2] },
            { name: "San Giacomo", camera: 2, showDesc: [], hideDesc: [1, 4], visible: [0, 1, 2] },
            { name: "Indoor", camera: 3, showDesc: [4], hideDesc: [1], visible: [3, 4, 5, 6, 7, 15, 16] }
        ];

        const hotspotFunctions = hotspotConfigs.map(config => () => {
            changeHotspotName(config.name);
            scenears.annotations.children[config.camera].moveHere(scenears.camera);
            config.showDesc.forEach(i => toggleDescription(i, true));
            config.hideDesc.forEach(i => toggleDescription(i, false));
            setAnnotationVisibility(config.visible);
        });

        // Bind click handlers
        hotspotFunctions.forEach((fn, i) => {
            $(`#li${i + 1}`).click(fn);
        });

        // Navigation between hotspots
        let idx;
        const getNextIdx = (currentIdx = 0, length, direction) => {
            if (direction === 'next') return (currentIdx + 1) % length;
            if (direction === 'prev') return (currentIdx === 0) ? length - 1 : currentIdx - 1;
            return currentIdx;
        };

        const navigateHotspot = (direction) => {
            idx = getNextIdx(idx, hotspotFunctions.length, direction);
            hotspotFunctions[idx]();
        };

        $("#prev").click(() => navigateHotspot('prev'));
        $("#next").click(() => navigateHotspot('next'));

        // Hide list when hotspot selected
        ['li1', 'li2', 'li3', 'li4'].forEach(id => {
            document.getElementById(id).addEventListener('click', () => {
                document.getElementById('lists').style.display = 'none';
            });
        });

        // Navigation controls
        const setParentOpacity = (opacity) => {
            const parentWin = window.parent;
            const sidebar = parentWin.document.getElementById('split-container');
            if (sidebar) sidebar.style.opacity = opacity;
        };
        // Open nav panel on click
        $("#question_icon").click(() => {
            $("#nav_panel").fadeIn();
            setParentOpacity("0.5");
        });
        // Close nav panel on click
        document.getElementById('nav_panel').addEventListener('click', () => {
            $("#nav_panel").fadeOut();
            setParentOpacity("1");
        });

        // Camera icon toggle
        $("#camera_icon").click(() => {
            console.log('Hai cliccato sulla camera');
            [0, 1, 2].forEach(i => {
                viewer.scene.orientedImages[i].visible = !viewer.scene.orientedImages[i].visible;
            });
        });
    </script>
        <script>
        let visiblePhase = -1;

        let phases = ['fase1', 'fase2', 'fase3', 'fase4', 'fase5', 'fase6', 'fase7', 'fase8', 'fase9']
        let phases_text = ['Before 1547', 'September 1547', 'November 1547', 'Winter 1547-1548', 'January 1550', 'June 1550', 'August 1550', 'October 1551', 'May 1553']

        function changeVisible(modelNumber) {
            if (modelNumber==-1) {
                viewer.scene.pointclouds[0].visible = true;
                viewer.scene.pointclouds[1].visible = true;
                document.getElementById("castle_phase_text").textContent= "Current state";
            } else {
                viewer.scene.pointclouds[0].visible = false;
                viewer.scene.pointclouds[1].visible = false;
                viewer.scene.scene.children.find(element => element.name == phases[modelNumber]).visible = true;
                document.getElementById("castle_phase_text").textContent= phases_text[modelNumber];
            }
            for (let i in phases) {
                if (i != modelNumber) {
                    //hide specific model i
                    viewer.scene.scene.children.find(element => element.name == phases[i]).visible = false;
                    console.log("Elemento nascosto: " + phases[i])
                }
            }
        }   
        

        let castlePhasesButton = document.getElementById("castle_phases");
        castlePhasesButton.onclick = () => {
            visiblePhase += 1;
            if (visiblePhase >= phases.length) {
                visiblePhase = -1;
            }
            changeVisible(visiblePhase);

        };

    </script>
